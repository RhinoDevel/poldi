playingBackPrefix_lang_en = "Playing "
stoppedPlayback_lang_en = "Stopped playback."
# German:
waitForMemExtractMsg_lang_de = "Tut mir leid, ich muss meine Erinnerungen aktualisieren, das dauert etwas. Danke für die Geduld, bitte warten."
waitForImportMsg_lang_de = "Enschuldigung, ich muss Nachrichten importieren, das dauert etwas. Danke für die Geduld, bitte warten."
topicNotFoundInChatHistory_lang_de = "Tut mir leid, zu dem Thema konnte ich in der Dialog-Protokoll nichts finden."
doYouWantMeToSearchChatHistory_lang_de = "Soll ich im Dialog-Protokoll nach dem Thema suchen?"
skippingChatHistorySearch_lang_de = "Die Suche im Dialog-Protokoll scheint nicht gewollt, ich breche sie ab."
askQuestionForWikipedia_lang_de = "Bitte stelle die Frage, die ich mit Hilfe von Wikipedia beantworten soll."
